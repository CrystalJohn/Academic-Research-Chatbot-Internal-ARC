name: Amplify Backend

on:
  push:
    branches: [main]
    paths:
      - 'amplify/**'
      - '.github/workflows/amplify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'amplify/**'

env:
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Amplify Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amplify

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit
