name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: ap-southeast-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --tb=short -q
        continue-on-error: true

  build:
    name: Build & Package
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Package backend
        run: |
          mkdir -p deploy
          cp -r backend/app deploy/
          cp backend/requirements.txt deploy/
          cp backend/run_worker.py deploy/ || true
          cp appspec.yml deploy/
          mkdir -p deploy/scripts
          cp -r scripts/deploy/* deploy/scripts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: deploy/
          retention-days: 5

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment package
        run: |
          cd deploy
          zip -r ../backend-${{ github.sha }}.zip .

      - name: Upload to S3
        run: |
          aws s3 cp backend-${{ github.sha }}.zip s3://${{ secrets.DEPLOY_BUCKET }}/backend/

      - name: Deploy with CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ secrets.DEPLOY_BUCKET }},key=backend/backend-${{ github.sha }}.zip,bundleType=zip \
            --description "GitHub Actions deployment ${{ github.sha }}"
